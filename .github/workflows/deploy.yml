name: Production Deploy — Frontend

on:
  push:
    branches: [main]

jobs:
  deploy-frontend-prod:
    name: Deploy Frontend — Vercel (prod)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for production and verify discovery endpoints
        run: |
          # Vercel's Git integration deploys pushes to main automatically.
          KEY="$(tr -d '\r\n' < public/9bdcae9db63f4f39996f3ad38cc52d32.txt)"
          sleep 120
          for attempt in {1..30}; do
            LIVE_KEY="$(curl --fail --silent --show-error "https://growwiseschool.org/${KEY}.txt" || true)"
            ROBOTS="$(curl --fail --silent --show-error "https://growwiseschool.org/robots.txt" || true)"
            SITEMAP="$(curl --fail --silent --show-error "https://growwiseschool.org/sitemap.xml" || true)"
            if [[ "$LIVE_KEY" == "$KEY" ]] \
              && [[ "$ROBOTS" == *"OAI-SearchBot"* ]] \
              && [[ "$ROBOTS" == *"PerplexityBot"* ]] \
              && [[ "$SITEMAP" == *"<sitemapindex"* ]]; then
              echo "Production discovery endpoints verified."
              exit 0
            fi
            echo "Production not ready (attempt ${attempt}/30); retrying in 10s."
            sleep 10
          done
          echo "Production verification timed out."
          exit 1

      - name: Notify IndexNow about changed frontend URLs
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/indexnow-submit.mjs --changed-since "$BEFORE_SHA"

      - name: Notify Slack — success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "🚀 *Production deployed* — frontend is live on Vercel\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }'

      - name: Notify Slack — failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "❌ *Production discovery verification failed* — check Vercel deployment, sitemap, robots, and IndexNow logs\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }'
